name: Meme of the Week reminder

# Every Friday at noon store time the bot posts config/meme-reminder.md in #meme-bunker:
# "don't forget to vote". Edit that file on GitHub to change the wording.
# Run it by hand from the Actions tab; tick "post" to really post (unticked = dry run).

on:
  # UTC clock, and scheduled runs often start hours late. So it fires several times on Friday;
  # the "when" step lets through runs that are Friday noon or later in New York, and the
  # script itself skips posting if the bot already posted the reminder today.
  schedule:
    - cron: "0 16 * * 5"
    - cron: "0 17 * * 5"
    - cron: "0 19 * * 5"
    - cron: "0 22 * * 5"
  workflow_dispatch:
    inputs:
      post:
        description: "Really post it (untick for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: when
        run: |
          hour=$(TZ=America/New_York date +%H)
          day=$(TZ=America/New_York date +%u)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$day" = "5" ] && [ "$((10#$hour))" -ge 12 ]; }; then go=true; else go=false; fi
          echo "New York hour $hour, run: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - if: steps.when.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.when.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.when.outputs.go == 'true'
        run: npm ci
      - if: steps.when.outputs.go == 'true'
        run: node cli/remind.mjs ${{ (github.event_name == 'schedule' || inputs.post) && '--execute' || '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
