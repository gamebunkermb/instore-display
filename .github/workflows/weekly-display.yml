name: Weekly in-store display

# Every morning at 6 AM store time: read approved memes and upcoming events from Discord, rebuild the
# slideshow page, and publish it to GitHub Pages. The Yodeck screen shows that page (a
# "Web Page" media item), so nothing in Yodeck changes when the content does.
#
# Two clocks start it (docs/operations.md):
#   - the store's own timer, which sends a "Run workflow" (workflow_dispatch) at 6 AM, on time;
#   - GitHub's schedule below, a fallback that often starts 7-12 hours late.
# Whichever comes first builds; the other finds the page already built today and skips.
# By hand from the Actions tab: "force" is ticked by default, so a run a person starts always
# rebuilds (e.g. right after approving memes). The store timer sends force=false, so it skips
# a page already built today. Untick "publish" to build only and download the result.

on:
  # GitHub's clock is UTC and doesn't know about daylight saving, and scheduled runs often
  # start hours late. So it fires several times a day, and the "when" job builds on the first
  # run that is 6 AM or later in New York and finds the live page not yet built today.
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the screen (untick to build only)"
        type: boolean
        default: true
      force:
        description: "Rebuild even if the page was already built today (the store timer sends false)"
        type: boolean
        default: true

# One run at a time: a second run waits, then sees what the first one published.
concurrency:
  group: instore-display
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Decides whether this run builds (rules and tests: lib/gate.mjs).
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node cli/gate.mjs build
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ inputs.publish }}

  # GitHub switches off scheduled workflows in a public repo after 60 days without a commit.
  # Re-enabling them on every run, built or skipped, keeps them on (needs "actions: write").
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: |
          for w in weekly-display.yml meme-reminder.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install ffmpeg (for video memes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Build the page (reads Discord only)
        run: node cli/build.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Keep a copy of what was built (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: display-${{ github.run_number }}
          path: out/
          retention-days: 7
      - name: Package for Pages
        if: github.event_name == 'schedule' || inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Runs on every run, built or skipped: the run goes red when the page the screen is showing
  # is more than 30 hours old, so a skipped build can't pass for a good day.
  fresh:
    name: Live page is fresh
    needs: [when, build, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cli/gate.mjs fresh

  # Any job failed: tell staff, if the STAFF_ALERT_WEBHOOK_URL secret is set (a Discord
  # webhook). The text is fixed wording plus job results and the run link, nothing from Discord.
  alert:
    name: Tell staff about a failure
    needs: [when, keep-alive, build, publish, fresh]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          WEBHOOK: ${{ secrets.STAFF_ALERT_WEBHOOK_URL }}
          MSG: >-
            In-store display: the "${{ github.workflow }}" run failed, so the shop screen may be
            showing old slides.
            Check: ${{ needs.when.result }}, keep schedules on: ${{ needs.keep-alive.result }},
            build: ${{ needs.build.result }}, publish: ${{ needs.publish.result }},
            live page fresh: ${{ needs.fresh.result }}.
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>
        run: |
          if [ -z "$WEBHOOK" ]; then echo "STAFF_ALERT_WEBHOOK_URL is not set: no alert sent."; exit 0; fi
          jq -n --arg c "$MSG" '{content: $c, allowed_mentions: {parse: []}}' |
            curl -fsS --retry 3 --max-time 20 -H "Content-Type: application/json" -d @- "$WEBHOOK" > /dev/null
          echo "Alert sent."
