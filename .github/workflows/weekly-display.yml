name: Weekly in-store display

# Every morning at 6 AM store time: read approved memes and upcoming events from Discord, rebuild the
# slideshow page, and publish it to GitHub Pages. The Yodeck screen shows that page (a
# "Web Page" media item), so nothing in Yodeck changes when the content does.
# Run it by hand from the Actions tab any time, e.g. right after approving memes or adding
# events. Untick "publish" to build only and download the result from the run.

on:
  # GitHub's clock is UTC and doesn't know about daylight saving, so this fires at both 10:00
  # and 11:00 UTC and the "when" job lets through only the one that is 6 AM in New York
  # (10:00 UTC in summer, 11:00 UTC in winter). Scheduled runs can start a few minutes late.
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the screen (untick to build only)"
        type: boolean
        default: true

concurrency:
  group: instore-display
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "06" ]; then go=true; else go=false; fi
          echo "New York hour $hour, run: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # GitHub switches off scheduled workflows in a public repo after 60 days without a commit.
  # Re-enabling this workflow each day keeps the schedule on (needs "actions: write").
  keep-alive:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly-display.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install ffmpeg (for video memes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Build the page (reads Discord only)
        run: node cli/build.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Keep a copy of what was built (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: display-${{ github.run_number }}
          path: out/
          retention-days: 7
      - name: Package for Pages
        if: github.event_name == 'schedule' || inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
