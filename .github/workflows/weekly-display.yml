name: Weekly in-store display

# Every morning at 6 AM store time: read approved memes and upcoming events from Discord, rebuild the
# slideshow page, and publish it to GitHub Pages. The Yodeck screen shows that page (a
# "Web Page" media item), so nothing in Yodeck changes when the content does.
# Run it by hand from the Actions tab any time, e.g. right after approving memes or adding
# events. Untick "publish" to build only and download the result from the run.

on:
  # GitHub's clock is UTC and doesn't know about daylight saving, and scheduled runs often
  # start hours late. So it fires several times a day, and the "when" job builds on the first
  # run that is 6 AM or later in New York and finds the live page not yet built today.
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the screen (untick to build only)"
        type: boolean
        default: true

concurrency:
  group: instore-display
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)
          # Day the live page was built, in New York time (empty if it can't be read).
          built=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/slides.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(new Date(JSON.parse(s).builtAt).toLocaleDateString("en-CA",{timeZone:"America/New_York"}))}catch{}})' || true)
          if [ "${{ github.event_name }}" != "schedule" ]; then go=true
          elif [ "$((10#$hour))" -ge 6 ] && [ "$built" != "$today" ]; then go=true
          else go=false; fi
          echo "New York $today hour $hour, live page built $built, run: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # GitHub switches off scheduled workflows in a public repo after 60 days without a commit.
  # Re-enabling the scheduled workflows each day keeps them on (needs "actions: write").
  keep-alive:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          for w in weekly-display.yml meme-reminder.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install ffmpeg (for video memes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Build the page (reads Discord only)
        run: node cli/build.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Keep a copy of what was built (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: display-${{ github.run_number }}
          path: out/
          retention-days: 7
      - name: Package for Pages
        if: github.event_name == 'schedule' || inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
