<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>In-store display</title>
<style>
  /* Brand: black, gold, red; Poppins (as gamebunker.net). Fonts are served with the page. */
  @font-face { font-family: Poppins; font-weight: 500; src: url(fonts/Poppins-Medium.ttf); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(fonts/Poppins-SemiBold.ttf); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); }
  @font-face { font-family: Poppins; font-weight: 800; src: url(fonts/Poppins-ExtraBold.ttf); }

  :root {
    --black: #0b0b0b; --panel: #161616; --line: #2a2a2a;
    --gold: #ffd700; --gold-soft: #fce477; --red: #b90000; --red-hot: #e01010;
    --white: #f5f5f5; --grey: #9a9a9a;
    --hazard: repeating-linear-gradient(-45deg, var(--gold) 0 26px, var(--black) 26px 52px);
  }
  html, body { margin: 0; height: 100%; background: var(--black); overflow: hidden; cursor: none; }
  body { font-family: Poppins, 'Segoe UI', Arial, sans-serif; color: var(--white); }

  /* Everything is laid out on a 1920x1080 stage, scaled to fit the screen. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
           transform-origin: 0 0; overflow: hidden;
           background: radial-gradient(ellipse at 50% 35%, #1c1c1c 0%, var(--black) 70%); }
  .hazard { position: absolute; left: 0; right: 0; height: 22px; background: var(--hazard); z-index: 5; }
  .hazard.top { top: 0; } .hazard.bottom { bottom: 0; }

  .slide { position: absolute; inset: 22px 0; opacity: 0; transition: opacity .7s ease; }
  .slide.on { opacity: 1; }

  /* ---------- Events ---------- */
  .ev-head { position: absolute; left: 90px; right: 90px; top: 46px; height: 190px;
             display: flex; align-items: center; justify-content: space-between; }
  .ev-head img { height: 170px; }
  .ev-title { text-align: right; }
  .ev-kicker { display: inline-block; background: var(--red); color: #fff; font-weight: 700;
               font-size: 30px; letter-spacing: 6px; padding: 6px 20px 4px; text-transform: uppercase; }
  .ev-big { font-weight: 800; font-size: 92px; line-height: 1; margin-top: 14px; letter-spacing: 1px;
            text-transform: uppercase; color: var(--gold); text-shadow: 0 4px 0 #000; }
  .ev-list { position: absolute; left: 90px; right: 90px; top: 268px; bottom: 96px;
             display: flex; flex-direction: column; gap: 18px; }
  .ev { display: flex; align-items: stretch; background: var(--panel); border: 2px solid var(--line);
        border-left: 10px solid var(--gold); min-height: 0; flex: 1 1 0; max-height: 150px;
        opacity: 0; transform: translateX(-40px); }
  .slide.on .ev { animation: in .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .ev.next { border-color: var(--gold); border-left-color: var(--red); background: #1d1a10; }
  .ev-date { width: 190px; flex: none; background: var(--gold); color: var(--black);
             display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .ev.next .ev-date { background: var(--red); color: #fff; }
  .ev-dow { font-weight: 700; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; }
  .ev-day { font-weight: 800; font-size: 64px; margin: 2px 0; }
  .ev-mon { font-weight: 700; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }
  .ev-body { flex: 1; padding: 0 36px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .ev-name { font-weight: 700; font-size: 52px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-time { font-weight: 500; font-size: 30px; color: var(--grey); margin-top: 4px; }
  .ev-time b { color: var(--gold-soft); font-weight: 600; }
  .ev-tag { font-weight: 700; font-size: 22px; letter-spacing: 3px; color: var(--red-hot); text-transform: uppercase; margin-right: 14px; }
  .ev-pts { flex: none; align-self: center; margin-right: 36px; text-align: center; line-height: 1;
            border: 4px solid var(--gold); padding: 14px 26px 12px; transform: skewX(-8deg); }
  .ev-pts span { display: block; transform: skewX(8deg); }
  .ev-pts .n { font-weight: 800; font-size: 54px; color: var(--gold); }
  .ev-pts .u { font-weight: 700; font-size: 20px; letter-spacing: 6px; color: var(--white); margin-top: 4px; }
  .ev-empty { position: absolute; inset: 300px 90px 120px; display: flex; flex-direction: column;
              align-items: center; justify-content: center; text-align: center; }
  .ev-empty .a { font-weight: 800; font-size: 96px; color: var(--gold); text-transform: uppercase; }
  .ev-empty .b { font-weight: 600; font-size: 40px; color: var(--grey); margin-top: 12px; }
  .ev-foot { position: absolute; left: 90px; right: 90px; bottom: 26px; display: flex;
             justify-content: space-between; align-items: center; font-size: 30px; font-weight: 600; color: var(--grey); }
  .ev-foot b { color: var(--white); }

  .ev-fmt { flex: none; align-self: center; margin-right: 36px; border: 4px solid var(--white);
            padding: 16px 24px 14px; font-weight: 800; font-size: 30px; letter-spacing: 4px; text-transform: uppercase;
            transform: skewX(-8deg); }
  .ev-fmt span { display: block; transform: skewX(8deg); }

  /* ---------- Tournament spotlight ---------- */
  .sp-main { position: absolute; left: 90px; top: 60px; width: 1130px; bottom: 150px; display: flex; flex-direction: column; }
  .sp-tags { display: flex; gap: 16px; align-items: center; }
  .sp-kind { background: var(--red); color: #fff; font-weight: 800; font-size: 34px; letter-spacing: 6px; padding: 8px 22px 6px; text-transform: uppercase; }
  .sp-game { color: var(--gold); font-weight: 700; font-size: 34px; letter-spacing: 4px; text-transform: uppercase; }
  .sp-when { margin-left: auto; border: 3px solid var(--gold); color: var(--gold); font-weight: 800; font-size: 28px;
             letter-spacing: 3px; padding: 6px 18px 4px; text-transform: uppercase; }
  .sp-name { font-weight: 800; font-size: 104px; line-height: 1.02; margin: 34px 0 40px; text-transform: uppercase;
             text-shadow: 0 6px 0 #000; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .sp-facts { display: flex; gap: 18px; }
  .sp-fact { flex: 1; background: var(--panel); border: 2px solid var(--line); border-top: 8px solid var(--gold); padding: 18px 22px 16px; }
  .sp-fact .k { font-weight: 700; font-size: 22px; letter-spacing: 4px; color: var(--grey); text-transform: uppercase; }
  .sp-fact .v { font-weight: 800; font-size: 46px; line-height: 1.15; margin-top: 4px; white-space: nowrap; }
  .sp-seats { margin-top: 30px; }
  .sp-bar { height: 34px; background: var(--panel); border: 2px solid var(--line); position: relative; overflow: hidden; }
  .sp-bar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(-45deg, var(--gold) 0 18px, #e6c200 18px 36px); }
  .sp-seats-t { display: flex; justify-content: space-between; margin-top: 12px; font-weight: 700; font-size: 32px; }
  .sp-seats-t .left { color: var(--red-hot); text-transform: uppercase; letter-spacing: 2px; }
  .sp-qr { position: absolute; right: 90px; top: 110px; width: 520px; background: #fff; color: #111;
           padding: 30px 30px 26px; text-align: center; box-shadow: 14px 14px 0 var(--gold); }
  .sp-qr img { width: 460px; height: 460px; display: block; }
  .sp-qr .a { font-weight: 800; font-size: 40px; letter-spacing: 2px; margin-top: 16px; text-transform: uppercase; }
  .sp-qr .b { font-weight: 600; font-size: 24px; color: #555; }
  .sp-foot { position: absolute; left: 90px; right: 90px; bottom: 30px; display: flex; align-items: center; justify-content: space-between; }
  .sp-foot img { height: 96px; }
  .sp-foot div { font-weight: 600; font-size: 30px; color: var(--grey); }
  .sp-foot b { color: var(--white); }

  /* ---------- League: the escalation ladder ---------- */
  .lg-top { position: absolute; left: 90px; right: 90px; top: 56px; }
  .lg-name { font-weight: 800; font-size: 88px; line-height: 1.02; margin-top: 26px; text-transform: uppercase;
             text-shadow: 0 6px 0 #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lg-sub { font-weight: 600; font-size: 38px; color: var(--grey); margin-top: 14px; }
  .lg-sub b { color: var(--gold-soft); }
  .lg-ladder { position: absolute; left: 90px; right: 90px; bottom: 150px; height: 470px;
               display: flex; align-items: flex-end; gap: 16px; }
  .lg-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; }
  .lg-bar { position: relative; background: var(--panel); border: 2px solid var(--line); border-top: 10px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 18px;
            transform-origin: bottom; transform: scaleY(0); }
  .slide.on .lg-bar { animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { transform: none; } }
  .lg-pts { font-weight: 800; font-size: 54px; line-height: 1; color: var(--gold); }
  .lg-u { font-weight: 700; font-size: 18px; letter-spacing: 5px; margin-top: 6px; }
  .lg-wk { font-weight: 800; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; margin-top: 14px; text-align: center; }
  .lg-day { font-weight: 600; font-size: 26px; color: var(--grey); text-align: center; }
  .lg-col.next .lg-bar { background: var(--gold); border-color: var(--gold); border-top-color: var(--red); box-shadow: 0 0 0 4px #000, 0 0 40px rgba(255,215,0,.35); }
  .lg-col.next .lg-pts, .lg-col.next .lg-u { color: var(--black); }
  .lg-col.next .lg-wk { color: var(--gold); }
  .lg-flag { position: absolute; top: -58px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff;
             font-weight: 800; font-size: 24px; letter-spacing: 4px; padding: 6px 16px 4px; white-space: nowrap; }
  .lg-col.done { flex: .6 1 0; opacity: .45; }
  .lg-col.done .lg-bar { border-top-color: var(--grey); justify-content: center; padding-top: 0; }
  .lg-col.done .lg-u { font-size: 20px; color: var(--grey); }

  /* ---------- Memes ---------- */
  /* The frame is 1840x886; fitMeme() scales each meme up or down to fill it. */
  .meme-frame { position: absolute; left: 40px; right: 40px; top: 34px; bottom: 116px;
                display: flex; align-items: center; justify-content: center; }
  .meme-frame img, .meme-frame video { max-width: 100%; max-height: 100%; display: block;
                                       outline: 4px solid var(--gold); outline-offset: 10px; background: #000; }
  .meme-tag { position: absolute; left: 60px; top: 28px; z-index: 2; background: var(--red); color: #fff;
              font-weight: 800; font-size: 30px; letter-spacing: 5px; padding: 8px 22px 6px; transform: rotate(-3deg);
              box-shadow: 0 6px 0 #000; text-transform: uppercase; }
  .meme-foot { position: absolute; left: 60px; right: 60px; bottom: 22px; height: 80px;
               display: flex; align-items: center; justify-content: space-between; }
  .meme-foot img { height: 78px; }
  .meme-foot div { font-size: 28px; font-weight: 600; color: var(--grey); }
  .meme-foot b { color: var(--gold); }

  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #loading img { width: 900px; opacity: .9; }
</style>
</head>
<body>
<div id="stage">
  <div class="hazard top"></div>
  <div id="loading"><img src="brand/logo-light.png" alt=""></div>
  <div class="hazard bottom"></div>
</div>
<script>
// The screen's slideshow. slides.json is rebuilt by the weekly GitHub Action; this page
// re-reads it at the end of every loop, so new content appears without touching Yodeck.
(() => {
  const PAGE_VERSION = '__PAGE_VERSION__';      // filled in by the build; slides.json carries the newest
  const RELOAD_EVERY_MS = 6 * 60 * 60 * 1000;   // a full reload now and then keeps the player's memory fresh
  const VIDEO_CAP_S = 90;                        // never sit on one video longer than this
  const started = Date.now();
  const stage = document.getElementById('stage');
  let data = { slides: [] };
  let i = 0, current = null, failures = 0;
  const shown = window.shown = [];               // recent slides, for checking from the console

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  }
  addEventListener('resize', fit); fit();

  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function load() {
    try {
      const r = await fetch('slides.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) {
        const d = await r.json();
        // A newer page was published (e.g. a design change): load it, past any cache.
        if (d.pageVersion && d.pageVersion !== PAGE_VERSION && PAGE_VERSION !== '__PAGE_VERSION__') {
          location.replace(location.pathname + '?v=' + encodeURIComponent(d.pageVersion));
          return;
        }
        if (Array.isArray(d.slides) && d.slides.length) data = d;
      }
    } catch (e) { /* keep showing what we had */ }
  }

  function show(el, label) {
    if (!el.isConnected) stage.insertBefore(el, stage.querySelector('.hazard.bottom'));
    void el.offsetWidth;                         // so the fade runs (no requestAnimationFrame: it pauses when hidden)
    el.classList.add('on');
    const loading = document.getElementById('loading'); if (loading) loading.remove();
    shown.push({ src: label, at: new Date().toISOString() }); if (shown.length > 20) shown.shift();
    const old = current; current = el;
    if (old) { old.classList.remove('on'); setTimeout(() => { old.querySelector('video')?.pause(); old.remove(); }, 900); }
  }

  function failed() {
    failures++;
    setTimeout(next, failures >= Math.max(data.slides.length, 1) ? 30000 : 0);   // all failing: wait, don't spin
  }

  // ---- Events slide, drawn from the event list in slides.json ----
  function dayKey(d, tz) { return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d); }
  function eventsSlide(s) {
    const tz = data.timeZone || 'America/New_York';
    const part = (d, o) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...o }).format(d);
    const today = dayKey(new Date(), tz), tomorrow = dayKey(new Date(Date.now() + 864e5), tz);
    const upcoming = (s.events || []).filter((e) => new Date(e.end || e.start) > new Date());
    const rows = upcoming.map((e, n) => {
      const d = new Date(e.start), k = dayKey(d, tz);
      const tag = k === today ? 'Today' : k === tomorrow ? 'Tomorrow' : '';
      const pts = e.points ? `<div class="ev-pts"><span class="n">${e.points.toLocaleString('en-US')}</span><span class="u">POINTS</span></div>`
        : e.format ? `<div class="ev-fmt"><span>${esc(e.format)}</span></div>` : '';
      return `<div class="ev${n === 0 ? ' next' : ''}" style="animation-delay:${0.15 + n * 0.12}s">
        <div class="ev-date"><div class="ev-dow">${part(d, { weekday: 'short' })}</div><div class="ev-day">${part(d, { day: 'numeric' })}</div><div class="ev-mon">${part(d, { month: 'short' })}</div></div>
        <div class="ev-body"><div class="ev-name">${esc(e.name)}</div>
          <div class="ev-time">${tag ? `<span class="ev-tag">${tag}</span>` : ''}<b>${part(d, { hour: 'numeric', minute: '2-digit' })}</b></div></div>
        ${pts}</div>`;
    }).join('');
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = `
      <div class="ev-head"><img src="brand/logo-light.png" alt="">
        <div class="ev-title"><div class="ev-kicker">Upcoming events</div><div class="ev-big">At the Bunker</div></div></div>
      ${rows ? `<div class="ev-list">${rows}</div>` : `<div class="ev-empty"><div class="a">New events soon</div><div class="b">Ask at the counter what's coming up</div></div>`}
      <div class="ev-foot"><div><b>Sign up</b> at the counter or on our Discord</div><div><b>${esc(data.website || '')}</b></div></div>`;
    return el;
  }

  // ---- One tournament, big, with a QR code to sign up ----
  function spotlightSlide(s) {
    const e = s.event, tz = data.timeZone || 'America/New_York';
    const d = new Date(e.start);
    const part = (o) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...o }).format(d);
    const days = Math.round((new Date(dayKey(d, tz)) - new Date(dayKey(new Date(), tz))) / 864e5);
    const when = days <= 0 ? 'Today' : days === 1 ? 'Tomorrow' : days < 7 ? 'This ' + part({ weekday: 'long' }) : `In ${days} days`;
    const facts = [
      ['Date', part({ weekday: 'short', month: 'short', day: 'numeric' })],
      ['Start', part({ hour: 'numeric', minute: '2-digit' })],
      e.points ? ['Points', e.points.toLocaleString('en-US')] : e.format ? ['Format', e.format] : null,
      e.entry ? ['Entry', e.entry] : null,
    ].filter(Boolean);
    let seats = '';
    if (e.seats && e.signedUp != null) {
      const left = Math.max(e.seats - e.signedUp, 0);
      const pct = Math.min(100, Math.round((e.signedUp / e.seats) * 100));
      seats = `<div class="sp-seats"><div class="sp-bar"><i style="width:${pct}%"></i></div>
        <div class="sp-seats-t"><span>${e.signedUp} / ${e.seats} signed up</span>
        <span class="left">${left === 0 ? 'Sold out' : left <= Math.max(3, e.seats / 4) ? `Only ${left} spot${left === 1 ? '' : 's'} left!` : `${left} spots left`}</span></div></div>`;
    } else if (e.seats) {
      seats = `<div class="sp-seats"><div class="sp-seats-t"><span>${e.seats} players</span></div></div>`;
    }
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = `
      <div class="sp-main">
        <div class="sp-tags"><span class="sp-kind">${esc(e.kind || 'Tournament')}</span><span class="sp-game">${esc(e.game || '')}</span><span class="sp-when">${when}</span></div>
        <div class="sp-name">${esc(e.name)}</div>
        <div class="sp-facts">${facts.map(([k, v]) => `<div class="sp-fact"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
        ${seats}
      </div>
      ${s.qr ? `<div class="sp-qr"><img src="${esc(s.qr)}" alt=""><div class="a">Scan to sign up</div><div class="b">on Best Coast Pairings</div></div>` : ''}
      <div class="sp-foot"><img src="brand/logo-light.png" alt=""><div><b>Sign up</b> at the counter or scan the code</div></div>`;
    return el;
  }

  // ---- A league: every week still to play, as a staircase of army points ----
  function leagueSlide(s, weeks) {
    const L = s.league, tz = data.timeZone || 'America/New_York';
    const fmt = (d, o) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...o }).format(new Date(d));
    const time = (d) => fmt(d, { hour: 'numeric', minute: '2-digit' }).replace(':00', '');
    const first = weeks[0];
    const days = Math.round((new Date(dayKey(new Date(first.start), tz)) - new Date(dayKey(new Date(), tz))) / 864e5);
    const when = days <= 0 ? 'Tonight' : days === 1 ? 'Tomorrow' : days < 7 ? 'This ' + fmt(first.start, { weekday: 'long' }) : `In ${days} days`;
    const sameDay = weeks.every((w) => fmt(w.start, { weekday: 'long' }) === fmt(first.start, { weekday: 'long' }));
    const hours = time(first.start) + (first.end ? '–' + time(first.end) : '');
    const max = Math.max(...weeks.map((w) => w.points || 0), 1);
    const h = (p) => Math.round(150 + 220 * ((p || max * 0.4) / max));    // bar height, 150–370px
    const done = [];
    for (let n = 1; n < first.week && n <= 4; n++) done.push(`<div class="lg-col done"><div class="lg-bar" style="height:110px">
      <div class="lg-u">PLAYED</div></div><div class="lg-wk">Wk ${n}</div><div class="lg-day">&nbsp;</div></div>`);
    const cols = weeks.map((w, n) => `<div class="lg-col${n === 0 ? ' next' : ''}">
      <div class="lg-bar" style="height:${h(w.points)}px;animation-delay:${0.2 + n * 0.12}s">${n === 0 ? `<div class="lg-flag">${when}</div>` : ''}
        ${w.points ? `<div class="lg-pts">${w.points.toLocaleString('en-US')}</div><div class="lg-u">POINTS</div>` : ''}</div>
      <div class="lg-wk">Week ${w.week}</div><div class="lg-day">${fmt(w.start, { month: 'short', day: 'numeric' })}</div></div>`).join('');
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = `
      <div class="lg-top">
        <div class="sp-tags"><span class="sp-kind">League</span><span class="sp-game">${esc(L.game || '')}</span>
          <span class="sp-when">Week ${first.week} of ${L.total}</span></div>
        <div class="lg-name">${esc(L.name)}</div>
        <div class="lg-sub"><b>${sameDay ? fmt(first.start, { weekday: 'long' }) + 's' : 'Weekly'} · ${hours}</b> · In store · Jump in any week</div>
      </div>
      <div class="lg-ladder">${done.join('')}${cols}</div>
      <div class="sp-foot"><img src="brand/logo-light.png" alt=""><div><b>Hit "Interested"</b> on the Discord event to get a reminder</div></div>`;
    return el;
  }

  function memeSlide(s) {
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = `<div class="meme-tag">Meme Bunker</div><div class="meme-frame"></div>
      <div class="meme-foot"><img src="brand/logo-light.png" alt=""><div>Post yours in <b>#meme-bunker</b> on our Discord</div></div>`;
    return el;
  }

  // Size a meme to fill the frame, keeping its shape. Small ones are enlarged (up to 3x).
  function fitMeme(m, w, h, frame) {
    if (!w || !h) return;
    const k = Math.min(frame.clientWidth / w, frame.clientHeight / h, 3);
    m.style.width = Math.floor(w * k) + 'px';
    m.style.height = Math.floor(h * k) + 'px';
  }

  async function next() {
    if (i >= data.slides.length) {
      i = 0;
      if (Date.now() - started > RELOAD_EVERY_MS) { location.reload(); return; }
      await load();
    }
    if (!data.slides.length) { setTimeout(next, 30000); return; }
    const s = data.slides[i++];

    if (s.type === 'league') {
      const weeks = (s.league?.weeks || []).filter((w) => new Date(w.end || w.start) > new Date());
      if (!weeks.length) { next(); return; }                // league finished: skip it
      failures = 0;
      show(leagueSlide(s, weeks), 'league');
      setTimeout(next, (s.seconds || 15) * 1000);
      return;
    }
    if (s.type === 'events' || s.type === 'spotlight') {
      // A spotlight for a tournament that has already started is skipped.
      if (s.type === 'spotlight' && new Date(s.event.start) < new Date()) { next(); return; }
      failures = 0;
      show(s.type === 'events' ? eventsSlide(s) : spotlightSlide(s), s.type);
      setTimeout(next, (s.seconds || 15) * 1000);
      return;
    }
    const el = memeSlide(s);
    const frame = el.querySelector('.meme-frame');
    if (s.type === 'video') {
      const v = document.createElement('video');
      v.src = s.src; v.muted = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto';
      frame.appendChild(v);
      v.addEventListener('loadedmetadata', () => fitMeme(v, v.videoWidth, v.videoHeight, frame), { once: true });
      let done = false;
      const go = () => { if (!done) { done = true; failures = 0; next(); } };
      v.addEventListener('ended', go);
      v.addEventListener('error', () => { if (!done) { done = true; el.remove(); failed(); } });
      v.addEventListener('playing', () => show(el, s.src), { once: true });
      setTimeout(go, Math.min(s.seconds || VIDEO_CAP_S, VIDEO_CAP_S) * 1000 + 1000);
      el.style.visibility = 'hidden'; stage.appendChild(el);   // load off-screen until it plays
      el.addEventListener('transitionstart', () => { el.style.visibility = ''; }, { once: true });
      v.addEventListener('playing', () => { el.style.visibility = ''; }, { once: true });
      v.play().catch(() => {});
    } else {
      const img = new Image();
      img.onload = () => { failures = 0; frame.appendChild(img); show(el, s.src); fitMeme(img, img.naturalWidth, img.naturalHeight, frame); setTimeout(next, (s.seconds || 12) * 1000); };
      img.onerror = () => failed();
      img.src = s.src;
    }
  }

  load().then(next);
})();
</script>
</body>
</html>
